[package]
name = "mesh"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["renderer", "util"]
resolver = "2"

[workspace.dependencies]
tracing = "0.1.41"
tao = "0.32.8"
glam = "0.30.1"
thiserror = "2.0.12"
util = { path = "./util/" }

[dependencies]
renderer = { path = "./renderer/" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"]}
tracing-log = "0.2.0"
tracing = { workspace = true }
tao = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.44.1", features = ["macros", "rt", "rt-multi-thread"] }
mesh-macros = { path = "./mesh-macros/" }
util = { workspace = true }
tracing-error = "0.2.1"
lazy_static = "1.5.0"
uuid = { version = "1.16.0", features = ["v4", "v8"] }
bitflags = "2.9.0"
